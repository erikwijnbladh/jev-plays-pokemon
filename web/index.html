<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Plays Pokémon</title>
<style>
  :root { --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc; --accent: #c0392b; --bar: #2f6fdf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141416; --panel: #1d1d21; --ink: #ececef; --muted: #9a9aa2; --line: #2c2c32; --accent: #ff6b5b; --bar: #6b9cff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  #screen { width: 100%; image-rendering: pixelated; border-radius: 6px; background: #000; aspect-ratio: 160 / 144; display: block; }
  .muted { color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .stat b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .opt { display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 8px; align-items: center; margin: 4px 0; }
  .opt .bar { height: 6px; border-radius: 3px; background: var(--bar); margin-top: 3px; }
  .opt.picked .label { color: var(--accent); font-weight: 600; }
  .opt .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  ul { margin: 6px 0 0; padding-left: 18px; }
  #log li { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<main>
  <section>
    <canvas id="screen" width="160" height="144" aria-label="Game screen"></canvas>
    <div class="stats panel">
      <div class="stat"><span class="muted">Jev calls</span><b id="calls">0</b></div>
      <div class="stat"><span class="muted">Cost</span><b id="cost">$0</b></div>
      <div class="stat"><span class="muted">Median latency</span><b id="lat">-</b></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="muted">Team</div>
      <ul id="team"></ul>
    </div>
  </section>
  <section style="display:grid; gap:16px; align-content:start">
    <div class="panel">
      <h1>Jev Plays Pokémon Red</h1>
      <div><span class="muted">Location:</span> <span id="loc"></span> · <span class="muted">Badges:</span> <span id="badges"></span> · <span class="muted">Focus:</span> <span id="focus"></span></div>
      <div style="margin-top:6px"><span class="muted">Objective:</span> <span id="obj"></span></div>
    </div>
    <div class="panel">
      <div class="muted">Last decision: <span id="purpose"></span></div>
      <div id="options"></div>
    </div>
    <div class="panel">
      <div class="muted">Log</div>
      <ul id="log"></ul>
    </div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const label = (k, v) => (v && typeof v === 'object' ? v.action || v.label || v.focus || k : typeof v === 'string' ? v : k);

  // live frames: palette + one index byte per pixel, pushed by the server over SSE
  const ctx2d = $('screen').getContext('2d');
  const image = ctx2d.createImageData(160, 144);
  function connect() {
    const es = new EventSource('/stream');
    es.onmessage = (ev) => {
      const { p, d } = JSON.parse(ev.data);
      const idx = Uint8Array.from(atob(d), (c) => c.charCodeAt(0));
      const px = image.data;
      for (let i = 0; i < idx.length; i++) {
        const c = p[idx[i]];
        px[i * 4] = c >> 16; px[i * 4 + 1] = (c >> 8) & 255; px[i * 4 + 2] = c & 255; px[i * 4 + 3] = 255;
      }
      ctx2d.putImageData(image, 0, 0);
    };
    es.onerror = () => { es.close(); setTimeout(connect, 1000); };
  }
  connect();

  async function poll() {
    try {
      const s = await (await fetch('/status')).json();
      $('loc').textContent = s.location; $('badges').textContent = s.badges; $('focus').textContent = s.focus || '-';
      $('obj').textContent = s.objective;
      $('calls').textContent = s.jev.calls; $('cost').textContent = '$' + s.jev.costUsd.toFixed(4);
      $('lat').textContent = s.jev.medianLatencyMs != null ? s.jev.medianLatencyMs + ' ms' : '-';
      $('team').innerHTML = s.team.map((t) => `<li>${esc(t)}</li>`).join('');
      $('log').innerHTML = s.log.slice().reverse().map((l) => `<li><span class="muted">${esc(l.kind)}</span> ${esc(l.msg)}</li>`).join('');
      const d = s.lastDecision;
      if (d) {
        $('purpose').textContent = d.purpose;
        const [qid, a] = Object.entries(d.answers)[0] || [];
        const opts = (d.options && d.options[qid]) || {};
        if (a && a.probabilities) {
          const rows = Object.entries(a.probabilities).sort((x, y) => y[1] - x[1]).slice(0, 8);
          $('options').innerHTML = rows.map(([k, p]) => `<div class="opt ${k === a.choice ? 'picked' : ''}"><div><div class="label">${esc(label(k, opts[k]))}</div><div class="bar" style="width:${Math.max(1, p * 100)}%"></div></div><div class="pct">${(p * 100).toFixed(0)}%</div></div>`).join('');
        }
      }
    } catch {}
    setTimeout(poll, 1000);
  }
  poll();
</script>
</body>
</html>
